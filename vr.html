<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" 
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover"
>
<title>VR</title>
<script>
      class rAF{
            #vr = null;
            #stop_track = () => {};
            #gFrame;
            
            constructor(canvas){
                  this.#forientation(canvas);
                  screen.orientation.addEventListener(
                        "change",
                        (e) => this.#forientation(canvas)
                  );
                  
                  document.body.addEventListener(
                        "pointermove",
                        (e) => {
                              if(this.#render === rAF.#stream){
                                    this.#vr.d_right_plus(
                                          Math.trunc(-e.movementY)
                                    );
                              }else{
                                    //pass
                              }
                        }
                  );
                  
                  this.#render();
            }

            #render(){
                  this.#gFrame(
                        (img) => {
                              this.#vr.draw(img).then(
                                    (fdraw) => {
                                          fdraw(img);
                                          img.close();
                                    } 
                              );
                        }
                  ).finally(
                        (_) => {
                              requestAnimationFrame(
                                    () => this.#render()
                              );
                        }
                  );
            }

            #pause(){
                  this.#gFrame = (__) => Promise.resolve(null);
                  this.#stop_track();
            }

            #resume(canvas){
                  get_full_environment_camera_for(
                        (track_full,width_full,height_full) => {
                              try{
                                    this.#vr = this.#vr ?? new vr(
                                          canvas,
                                          width_full,
                                          height_full
                                    );
                                    
                                    this.#stop_track = () => {
                                          this.#stop_track = () => {};
                                          track_full.stop();
                                    };
                                    
                                    let imgc = new ImageCapture(track_full);
                                    this.#gFrame = (f) => imgc.grabFrame().then(f).catch(
                                          (err) => {
                                                alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                                          }
                                    );
                              }catch(e){
                                    this.#pause();
                                    this.#vr = null;
                                    throw e;
                              }
                        }
                  ).catch(
                        (err) => {
                              alert(err);
                        }
                  );
            }
            
            #forientation(canvas){
                  let type = screen.orientation?.type ?? "";
                  if( type.startsWith("landscape") === true ){
                        this.#resume(canvas);
                        document.body.requestFullscreen();
                  }else{
                        this.#pause();
                        document.exitFullscreen();
                  }
            }
      }
      
      function init(canvas){
            screen.orientation.addEventListener(
                  "change",
                  (e) => keep_wake()
            );
            canvas.addEventListener(
                  "pointermove",
                  (e) => e.stopPropagation()
            );
            let raf = new rAF(canvas);
      }
      
      function keep_wake(){
            navigator.wakeLock.request('screen').then(
                  (wake_lock) => wake_lock.addEventListener(
                        "release",
                        (e) => keep_wake(),
                        { once: true }
                  )
            );
      }
</script>
<script src="camera.js"></script>
<script src="vr.js"></script>
<style>
      ::backdrop,body{
            background-color: green;
      }
      html,body{
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            touch-action: none;
      }
      div{
            position: fixed;
            background-color: burlywood;
      }
      
      canvas{
            width: 100%;
            height:100%;
            background-color: skyblue;
            object-fit: cover;
      }
      @media (orientation: portrait) {
            div{   
                  top: 0px;
                  right:0px;
                  bottom: 0px;
                  left: 0px;      
            }
            canvas {
                  visibility: hidden;
            }
      }
      @media (orientation: landscape) {
            div{
                  top: env(safe-area-max-inset-top, 0px);
                  --side-inset-raw: max(
                        env(safe-area-max-inset-left, 0px),
                        env(safe-area-max-inset-right, 0px)
                  );
                  --side-inset: calc(
                        sign(
                              abs(
                                    var(--side-inset-raw)
                              )
                        ) * var(--side-inset-raw) +
                        (
                              1 - 
                              sign(
                                    abs(
                                          var(--side-inset-raw)
                                    )
                              )
                        ) * (64px)
                  );
                  right: var(--side-inset);
                  bottom: env(safe-area-max-inset-bottom, 0px);
                  left: var(--side-inset);
                  background-color: red;
            }
            canvas {
                  visibility: visible;
            }
      }
</style>
</head>
<body onload="init(
      document.getElementById('show')
)">
   <div>
         <canvas id="show"></canvas>
         Help Info here.
   </div>
</body>
</html>
