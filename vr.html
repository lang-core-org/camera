<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" 
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover"
>
<title>VR</title>
<script>
      function f(){
            screen.orientation.addEventListener(
                  "change",
                  (e) => keep_wake()
            );
      }
      function keep_wake(){
            let type = screen.orientation?.type ?? "";
            if( type.startsWith("landscape") === true ){
                document.body.requestFullscreen();
            }else{
                document.exitFullscreen();
            }
            navigator.wakeLock
                .request('screen')
                .then(
                    (wake_lock) => wake_lock.addEventListener(
                        "release",
                        (e) => keep_wake(),
                        { once: true }
                    )
                );
      }
</script>
<style>
      body,::backdrop{
            width: 100dvw;
            height: 100dvh;
            background-color: green;
      }
      div{
            position: fixed;
            top: env(safe-area-max-inset-top, 0px); 
            right: env(safe-area-max-inset-right, 0px);
            bottom: env(safe-area-max-inset-bottom, 0px);
            left: env(safe-area-max-inset-left, 0px);
            background-color: red;
      }
      canvas{
            width: 100%;
            height:100%;
            background-color:skyblue;
      }
      @media (orientation: portrait) {
            canvas {
                  display: none;
            }
      }
      @media (orientation: landscape) {
            canvas {
                  display: block;
            }
      }
</style>
</head>
<body onload="f()">
   <div>
         <canvas></canvas>
   </div>
</body>
</html>
