<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" 
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover"
>
<title>VR</title>
<script>
      class rAF{
            #vrs;
      }
      function init(canvas){
            screen.orientation.addEventListener(
                  "change",
                  (e) => keep_wake()
            );
            canvas.addEventListener(
                  "pointermove",
                  (e) => e.stopPropagation()
            );
            screen.orientation.addEventListener(
                  "change",
                  (e) => keep_wake(canvas)
            );
            document.body.addEventListener(
                  "pointermove", 
                  (e) => {
                        const dy = -e.movementY;
                  }
            );
      }
      function foo(canvas){
            let type = screen.orientation?.type ?? "";
            if( type.startsWith("landscape") === true ){
                document.body.requestFullscreen();
            }else{
                document.exitFullscreen();
            }
      }
      
      function keep_wake(){
            navigator.wakeLock.request('screen').then(
                  (wake_lock) => wake_lock.addEventListener(
                        "release",
                        (e) => keep_wake(),
                        { once: true }
                  )
            );
      }
</script>
<script src="camera.js"></script>
<script src="vr.js"></script>
<style>
      ::backdrop{
            background-color: green;
      }
      html,body{
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            touch-action: none;
      }
      div{
            position: fixed;
            background-color: red;
      }
      
      canvas{
            width: 100%;
            height:100%;
            background-color:skyblue;
      }
      @media (orientation: portrait) {
            div{   
                  top: 0px;
                  right:0px;
                  bottom: 0px;
                  left: 0px;      
            }
            canvas {
                  visibility: hidden;
            }
      }
      @media (orientation: landscape) {
            div{
                  top: env(safe-area-max-inset-top, 0px);
                  --side-inset-raw: max(
                        env(safe-area-max-inset-left, 0px),
                        env(safe-area-max-inset-right, 0px)
                  );
                  --side-inset: calc(
                        sign(
                              abs(
                                    var(--side-inset-raw)
                              )
                        ) * var(--side-inset-raw) +
                        (
                              1 - 
                              sign(
                                    abs(
                                          var(--side-inset-raw)
                                    )
                              )
                        ) * (64px)
                  );
                  right: var(--side-inset);
                  bottom: env(safe-area-max-inset-bottom, 0px);
                  left: var(--side-inset);
                  background-color: red;
            }
            canvas {
                  visibility: visible;
            }
      }
</style>
</head>
<body onload="init(
      document.getElementById('show')
)">
   <div>
         <canvas id="show"></canvas>
   </div>
</body>
</html>
