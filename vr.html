<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" 
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no"
>
<title>VR</title>
<script>
      function f(){
            document.body.addEventListener(
                  "click",
                  keep_wake,
                  {once: true}
            );
      }
      function keep_wake(){
            document.body.requestFullscreen().then(
                  (und) => screen.orientation.lock("landscape")
            ).then(
                  (und) => navigator.wakeLock.request('screen').then(
                        (wake_lock) => wake_lock.addEventListener(
                              "release",
                              (e) => keep_wake(),
                              { once: true }
                        )
                  )
            ).catch(
                  (e) => {
                        alert(e);
                  }
            );  
      }
</script>
<style>
      #ctrl{
            position: fixed;
            left: 1dvw;
            top: 0dvh;
            width: 100dvh;
            transform: rotate(90deg);
      }
</style>
</head>
<body onload="f()">
   <input id= "ctrl" type="range"/>
      Click To Beign VR
</body>
</html>
