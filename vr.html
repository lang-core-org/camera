<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" 
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover"
>
<title>VR</title>
<script>
      function f(){
            document.body.addEventListener(
                  "click",
                  keep_wake,
                  {once: true}
            );
      }
      function keep_wake(){
            document.body.requestFullscreen().then(
                  (und) => navigator.wakeLock.request('screen').then(
                        (wake_lock) => wake_lock.addEventListener(
                              "release",
                              (e) => keep_wake(),
                              { once: true }
                        )
                  )
            ).catch(
                  (e) => {
                        alert(e);
                  }
            );  
      }
</script>
<style>
      body,::backdrop{
            width: 100dvw;
            height: 100dvh;
            background-color: green;
      }
      canvas{
            position: fixed;
            top: env(safe-area-max-inset-top, 0px); 
            right: env(safe-area-max-inset-right, 0px);
            bottom: env(safe-area-max-inset-bottom, 0px);
            left: env(safe-area-max-inset-left, 0px);
            width: 100dvw;
            height: 100dvh;
            background-color: red;
      }
</style>
</head>
<body onload="f()">
   <canvas></canvas>
</body>
</html>
