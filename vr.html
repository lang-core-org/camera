<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" 
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover"
>
<title>VR</title>
<script>
      function init(canvas){
            screen.orientation.addEventListener(
                  "change",
                  (e) => keep_wake()
            );
            canvas.addEventListener(
                  "pointermove",
                  (e) => e.stopPropagation()
            );
            const ctx = canvas.getContext("2d");
            document.body.addEventListener(
                  "pointermove", 
                  (e) => {
                        const dx = e.movementX;
                        const dy = e.movementY;

                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                        ctx.font = "30px sans-serif";
                        ctx.fillStyle = "black";
                        ctx.fillText(`dy: ${dy}`, 20, 40);
                  }
            );
      }
      function keep_wake(){
            let type = screen.orientation?.type ?? "";
            if( type.startsWith("landscape") === true ){
                document.body.requestFullscreen();
            }else{
                document.exitFullscreen();
            }
            navigator.wakeLock
                .request('screen')
                .then(
                    (wake_lock) => wake_lock.addEventListener(
                        "release",
                        (e) => keep_wake(),
                        { once: true }
                    )
                );
      }
</script>
<style>
      ::backdrop{
            background-color: green;
      }
      body{
            width: 100%;
            height: 100%;
            touch-action: none;
      }
      div{
            position: fixed;
            background-color: red;
      }
      
      canvas{
            width: 100%;
            height:100%;
            background-color:skyblue;
      }
      @media (orientation: portrait) {
            div{   
                  top: 0px;
                  right:0px;
                  bottom: 0px;
                  left: 0px;      
            }
            canvas {
                  visibility: hidden;
            }
      }
      @media (orientation: landscape) {
            div{
                  top: env(safe-area-max-inset-top, 0px);
                  right: env(safe-area-max-inset-right, 0px);
                  bottom: env(safe-area-max-inset-bottom, 0px);
                  left: env(safe-area-max-inset-left, 0px);
                  background-color: red;
            }
            canvas {
                  visibility: visible;
            }
      }
</style>
</head>
<body onload="init(
      document.getElementById('show')
)">
   <div>
         <canvas id="show"></canvas>
   </div>
</body>
</html>
