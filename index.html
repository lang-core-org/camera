<!DOCTYPE html>
<head>
    <meta name="viewport" content="
    width=device-width
    height=device-height
    initial-scale=1.0
    minimum-scale=1.0
    maximum-scale=1.0
    user-scalable=no">
    <script>

        let INFO = Object.freeze(
            {
                CAPTURING: t => `O`,
                CAPTURED: t => t
            }
        );
        function update_info(info,left,right){
            info.innerText = `${left('>')} _ ${right('<')}`;
        }
        function replace_info(info,new_info){
            let ret = info.innerText;
            info.innerText = new_info;
            return ret;
        }

        class rAF{
            #img = null;
            #tools;
            #finfo;
            #handle;
            #fpointer;
            #capture;
            #canvas;
            #vr_handle = () => Promise.reject("no capture");
            #vr_flag = document.getElementById("sbs-vr");
            
            #writer = () => file.of("downloads").then(
                (files) => {
                    //re-enter Fullscreen if need
                    rAF.#forientation();
                    // func  ???(file_name, data)
                    this.#writer = () => Promise.resolve(
                        files.save_file
                    );
                    return files.save_file;
                }
            );

            
            constructor(tools,info,canvas){
                this.#tools = tools;
                this.#finfo = (left,right) => 
                    update_info(info,left,right);
                this.#canvas = canvas;
                
                this.#update(
                    INFO.CAPTURING,
                    INFO.CAPTURING,
                    rAF.#original,
                    rAF.#abstract_pointer(
                        this,
                        rAF.#capture_left,
                        rAF.#capture_right
                    )
                );
                
                this.#capture = rAF.#no_capture;
                rAF.#render(this);
                
                document.body.addEventListener(
                    "pointerdown",
                    (e) => this.#fpointer(e)
                );

                screen.orientation.addEventListener(
                    "change",
                    (e) => {
                        rAF.#forientation();
                        tools.horizon_update_rotation_transform();
                        rAF.#capture_cancel(this);
                    }
                );

                rAF.#fwake();
                
            }

            #replace(img){
                this.#tools.horizon_expect_locked(img !== null);
                this.#img?.close();
                this.#img = img;
            }

            #update(
                left,
                right,
                handle,
                fpointer
            ){
                this.#handle = handle;
                this.#fpointer = fpointer;
                this.#finfo(left,right);
            }
            
            static #original(ref){
                ref.#tools.gFrame(
                    (img) => {
                        ref.#tools.preview_2d(img);
                        ref.#capture(ref,img);
                        rAF.#next_render(ref);
                    }
                );
            }

            static #draw_left_first(left){
                return (ref) => {
                    ref.#tools.gFrame(
                        (right) => {
                            ref.#tools
                               .preview_3d(
                                   left,
                                   right
                               );
                            ref.#capture(ref,right);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #draw_right_first(right){
                return (ref) => {
                    ref.#tools.gFrame(
                        (left) => {
                            ref.#tools
                               .preview_3d(
                                   left,
                                   right
                               );
                            ref.#capture(ref,left);
                            rAF.#next_render(ref);
                        }
                    );
                }
            }

            static #snooze(ref){
                //PASS
            }

            static #fwake(){
                document.body.addEventListener(
                    "pointerdown",
                    (e) => {
                        navigator.wakeLock.request('screen').then(
                            (wake_lock) => wake_lock.addEventListener(
                                "release",
                                (e) => rAF.#fwake(),
                                { once: true }
                            )
                        );
                    },
                    { once: true }
                );
            }
            
            static #forientation(){
                let type = screen.orientation?.type ?? "";
                if( type.startsWith("landscape") === true ){
                    return document.body.requestFullscreen();
                }else{
                    return document.exitFullscreen();
                }
            }

            //no-used
            static #fvisible(){
                document.body.addEventListener(
                    "visibilitychange",
                    (e) => {
                        if(document.visibilityState === "visible"){
                            
                        }else{
                            //PASS
                        }
                    }
                );
            }

            static #abstract_pointer(ref,left,right){
                return ({clientX}) => {
                    let half = document.documentElement.clientWidth / 2;
                    if(clientX < half){
                        left(ref);
                    }else if(clientX > half){
                        right(ref);
                    }else{
                        //PASS
                    }
                };
            }
            
            static #next_render(ref){
                requestAnimationFrame(
                    () => ref.#handle(ref)
                );
            }
            static #render(ref){
                ref.#handle(ref);
            }

            static #no_capture(ref,img = null){
                img?.close();
            }
            
            static #capture_left(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#vr_handle = ref.#tools.vr_adapter.draw_left;
                            ref.#update(
                                INFO.CAPTURED,
                                INFO.CAPTURING,
                                rAF.#draw_left_first(
                                    ref.#img
                                ),
                                rAF.#abstract_pointer(
                                    ref,
                                    rAF.#capture_cancel,
                                    rAF.#capture_other
                                )
                            );
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static #capture_right(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        if(img === null){
                            //PASS
                        }else{
                            ref.#replace(img);
                            ref.#vr_handle = ref.#tools.vr_adapter.draw_right;
                            ref.#update(
                                INFO.CAPTURING,
                                INFO.CAPTURED,
                                rAF.#draw_right_first(
                                    ref.#img
                                ),
                                rAF.#abstract_pointer(
                                    ref,
                                    rAF.#capture_other,
                                    rAF.#capture_cancel
                                )
                            );
                        }
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            static #capture_other(ref){
                if(
                    ref.#capture !== rAF.#no_capture ||
                    ref.#img === null
                ){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#update(
                            INFO.CAPTURED,
                            INFO.CAPTURED,
                            rAF.#snooze,
                            (e) =>{ /*PASS*/ }
                        );
                        
                        ref.#tools.horizon_unable_show();

                        Promise.allSettled(
                            [
                                ref.#writer(),
                                rAF.#dubois_blob_writer(ref),
                                rAF.#vr_blob_writer(ref)
                            ]
                        ).then(
                            (
                                [
                                    fwrite,
                                    dubois_blob_writer,
                                    vr_blob_writer
                                ]
                            ) => {
                                ref.#replace(null);
                                img?.close();
                                ref.#vr_handle = () => Promise.reject("no capture");
                                ref.#update(
                                    INFO.CAPTURING,
                                    INFO.CAPTURING,
                                    rAF.#original,
                                    rAF.#abstract_pointer(
                                        ref,
                                        rAF.#capture_left,
                                        rAF.#capture_right
                                    )
                                );
                                
                                ref.#tools.horizon_enable_show();
                                ref.#capture = rAF.#no_capture;
                                rAF.#render(ref);

                                
                                fwrite = fwrite?.value ?? null;
                                dubois_blob_writer = dubois_blob_writer?.value ?? null;
                                vr_blob_writer = vr_blob_writer?.value ?? null;
                                if(
                                    fwrite === null ||
                                    dubois_blob_writer === null ||
                                    vr_blob_writer === null
                                ){
                                    return Promise.reject();
                                }else{
                                    return Promise.all(
                                        [
                                            dubois_blob_writer(fwrite),
                                            vr_blob_writer(fwrite)
                                        ]
                                    );
                                }     
                            }
                        ).catch(
                            (__) => alert("failed to keep img!")
                        );
                    
                    };
                }
            }

            static #capture_cancel(ref){
                if(ref.#capture !== rAF.#no_capture){
                    //PASS
                }else{
                    ref.#capture = (ref,img = null) => {
                        ref.#vr_handle = () => Promise.reject("no capture");
                        ref.#replace(null);
                        img?.close();
                        ref.#update(
                            INFO.CAPTURING,
                            INFO.CAPTURING,
                            rAF.#original,
                            rAF.#abstract_pointer(
                                ref,
                                rAF.#capture_left,
                                rAF.#capture_right
                            )
                        );
                        
                        ref.#capture = rAF.#no_capture;
                    };
                }
            }

            /*for Dubois Anaglyph (default)
            return Promise resolved with 
            Blob blob (image/png) represent what you preview
            */
            static #dubois_blob_writer(ref){
                return new Promise(
                    (resolve, reject) => ref.#canvas.toBlob(
                        (blob) => {
                            if(blob !== null){
                                return resolve(
                                    (writer) => writer(
                                        `3D_Image [${new Date().getTime()}].png`,
                                        blob
                                    )
                                );
                            }else{
                                return reject("PNG Export Error");
                            }
                        },
                        "image/png"
                    )
                );
            }

            /*for SBS VR (additional)
            */
            static #vr_blob_writer(ref){
                let want_vr = ref.#vr_flag.checked;
                return (want_vr) ? ref.#vr_handle(
                    ref.#img
                ).then(
                    (draw) => draw(img)
                ).then(
                    (vro) => vro.toBlob()
                ).then(
                    (blob) => (writer) => writer(
                        `VR_Image [${new Date().getTime()}]_SBS.png`,
                        blob
                    )
                ): Promise.resolve( (__) => {} );
            }
        }

        function init(canvas,info,horizon,save,help){
            get_full_environment_camera_for(
                (
                    track_full,
                    width_full,
                    height_full
                ) => fcamera(
                    track_full,
                    width_full,
                    height_full,
                    canvas,
                    horizon
                )
            ).then(
                (tools) => {
                    let c = new rAF(tools,info,canvas);

                    save.addEventListener(
                        "pointerdown",
                        (e) => e.stopPropagation()
                    ); 
                    
                    help.addEventListener(
                        "pointerdown",
                        (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            tools.horizon_unable_show();
                            let old_info = replace_info(
                                info,
`\
click left first to capture left,
then click right to capture right and save photo,
or click left to cancel.
click right first to capture right,
then click left to capture left and save photo,
or click right to cancel.`
                            );
                            help.addEventListener(
                                "pointerup",
                                (e) => {
                                    e.preventDefault();
                                    e.stopPropagation();
                                    replace_info(info,old_info);
                                    tools.horizon_enable_show();
                                },
                                { once:true }
                            );
                        }
                    );
                    
                }
        ).catch(
                (err) => {
                    alert(`Catch the Fatal Error:\n${err}`);
                }
            );

        }

        function fcamera(
            track_full,
            width_full,
            height_full,
            canvas,
            horizon
        ){
            return Promise.all(
                [
                    gpu.of(
                        canvas,
                        width_full,
                        height_full
                    ),
                    vr.of(
                        width_full,
                        height_full
                    )
                ]
            ).then(
                (
                    [
                        render,
                        vr_adapter
                    ]
                ) => {
                    let imgc = new ImageCapture(track_full);
                    let draw_2d = direct.draw(render);
                    let draw_3d = dubois.anaglyph(render);
                    /* [Horizon Interface]
                        Horizon.display_with(svg_element)
                        create Horizon instance, associate display with svg_element
                    */
                    let horizon_proc = Horizon.display_with(horizon);
                    return {
                        gFrame: (f)  => imgc.grabFrame().then(f).catch(
                            (err) => {
                                alert(`Cannot Capture an Image from the Camera, due to:\n${err}`);
                            }
                        ),
                        preview_2d: draw_2d,
                        preview_3d: draw_3d,
                        vr_adapter: vr_adapter,
                        /* [Horizon Interface]
                            Horizon::expect_locked(expect_what)
                            expect_what === true:
                                 expect to locked nearest device orientation as horizon,
                                 then tracking and prompt to keep it
                            expect_what === false:
                                 unlocked horizon
                            note: 
                                 expect_what is bool
                        */
                        horizon_expect_locked: (expect_what) => horizon_proc.expect_locked(expect_what),
                        /* [Horizon Interface]
                            Horizon::update_rotation_transform()
                            update rotation transform due to screen orientation change
                        */
                        horizon_update_rotation_transform: () => horizon_proc.update_rotation_transform(),
                        /* [Horizon Interface]
                            Horizon::unable_show()
                            unable to show horizon, means hide horizon
                        */
                        horizon_unable_show: () => horizon_proc.unable_show(),
                        /* [Horizon Interface]
                            Horizon::enable_show()
                            enable to show horizon, means show horizon if available
                        */
                        horizon_enable_show: () => horizon_proc.enable_show()
                    };
                }
            );
        }
        
    </script>
    <script src="camera.js"></script>
    <script src="gpu.js"></script>
    <script src="vr.js"></script>
    <script src="horizon.js"></script>
    <script src="https://lang-core.org/file.js"></script>
    <style>
        canvas,#info,#horizon{
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%,-50%);
        }
        canvas{
            z-index:1;
            width:100dvw;
            height:100dvh;
            object-fit: contain;
        }
        #horizon{
            z-index:2;
            width:30dvw;
            height:30dvh;
        }
        #info,#horizon{
            pointer-events: none;
            opacity: 0.5;
        }  
        #help{
            position:fixed;
            right: 5%;
            bottom: 5%;
            width: 3rem;
            height: 3rem;
            border: 0.1rem solid white;
            
            display: flex;
            justify-content: center;
            align-items: center;
        }
        fieldset{
            position:fixed;
            left: 1%;
            bottom:1%;
        }
        #info,#help,fieldset{
            z-index:3;
            font-family: emoji;
            font-weight:bold;
            font-size:1.1rem;
            color: white;
            user-select:none;
        }
        body{
            background-color: black;
            width:100dvw;
            height:100dvh;
        }
    </style>
</head>
<body 
onload="init(
    document.getElementById('img_canvas'),
    document.getElementById('info'),
    document.getElementById('horizon'),
    document.getElementById('save'),
    document.getElementById('help')
)">
    <div id="info"></div>
    <svg id="horizon" 
         viewBox="0 0 100 100" 
         preserveAspectRatio="xMidYMid meet">
    </svg>
    <canvas id="img_canvas"></canvas>
    <div id="help">❔</div>
    <fieldset id="save">
        <legend>Also Save as</legend>
        <div>
            <input type="checkbox" id="sbs-vr"/>
            <label for="sbs-vr">SBS VR</label>
        </div>
    </fieldset>
    
</body>
